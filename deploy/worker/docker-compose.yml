# Projeto compose do aspen-worker no VPS (ADR 0013). O operador instala este
# arquivo em /docker/aspen-worker/docker-compose.yml (docs/worker-runbook.md);
# o deploy só troca a tag da imagem. Mudança aqui exige reinstalar no VPS.
name: aspen-worker

services:
  worker:
    image: aspen-worker:${ASPEN_WORKER_TAG:?tag do deploy em /docker/aspen-worker/current-tag}
    container_name: aspen-worker
    restart: unless-stopped
    init: true
    # Segredos do worker, escritos pelo operador (root, 0600).
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    # Cobre o passo de envio em curso; ver SHUTDOWN_GRACE_MS em api/_worker/main.ts.
    stop_grace_period: 90s
    # Gate do deploy (`up --wait`). Fica aqui, e não só na imagem, para um commit
    # não conseguir desligá-lo. Não toca o banco.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 30s
      start_interval: 2s
      retries: 3
    networks:
      - evolution
    labels:
      - traefik.enable=true
      - traefik.docker.network=evolution-api-zscx_default
      - traefik.http.routers.aspen-worker.rule=Host(`aspen-worker.srv1892439.hstgr.cloud`) && (Path(`/health`) || Path(`/wake`))
      - traefik.http.routers.aspen-worker.entrypoints=websecure
      - traefik.http.routers.aspen-worker.tls.certresolver=letsencrypt
      - traefik.http.services.aspen-worker.loadbalancer.server.port=8080
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

networks:
  # Rede do projeto do Evolution, que pertence à Hostinger: só entramos nela.
  evolution:
    external: true
    name: evolution-api-zscx_default
