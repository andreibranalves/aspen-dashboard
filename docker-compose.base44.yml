services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: aspen
      POSTGRES_USER: aspen
      POSTGRES_PASSWORD: aspen_dev_pw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aspen -d aspen"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  migrate:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./drizzle:/drizzle:ro
    environment:
      PGPASSWORD: aspen_dev_pw
    entrypoint: ["sh", "-c", "for f in /drizzle/0*.sql; do echo \"Applying $$f\"; psql -v ON_ERROR_STOP=1 -h postgres -U aspen -d aspen -f \"$$f\"; done && echo 'All migrations applied.'"]

  app:
    image: node:22
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app
    ports:
      - "3000:5173"
    environment:
      DATABASE_URL: postgresql://aspen:aspen_dev_pw@postgres:5432/aspen
      APP_AUTH_BYPASS: "true"
      APP_ENV: development
      EXTERNAL_WRITES_ENABLED: "0"
      NODE_ENV: development
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}
    env_file:
      - /run/base44/app.env
    command: sh -c "npm install && npm run dev"
