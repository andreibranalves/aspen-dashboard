name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Classifica o diff de forma conservadora. Só documentação Markdown conhecida
  # pode seguir pelo job barato; qualquer configuração, script, runtime ou
  # caminho desconhecido mantém as lanes de código.
  #
  # NOTE: branch protection for master could NOT be confirmed remotely (GitHub
  # REST returns 403 on this plan/repository visibility — see ticket evidence).
  # If any of these lanes later become REQUIRED checks, remove the `if` guards
  # below BEFORE relying on merge gating; a skipped job reports success only
  # when it is not a required check.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/classify-ci-changes.mjs

  docs:
    needs: [changes]
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check documentation diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  lint:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  types:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  boundary:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:db-boundary
      - run: npm run check:integration-boundary
      - run: npm run check:whatsapp-extension
      - run: npm run check:vercel-functions
      - run: npm run check:ui-ratchet

  postgres:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/aspen_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aspen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aspen_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test:postgres
      # GitHub's Ubuntu image already contains Chromium's system libraries.
      # Avoid apt here: third-party runner repositories can be briefly out of sync.
      - run: npx playwright install chromium
      - run: npx playwright test tests/quotation-origin.spec.js
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      # Separate invocation: the ingestion route is rate limited per server
      # process, so this journey keeps its own disposable app server. The safe
      # entrypoint strips operational credentials and preloads the egress guard
      # before the server (and Vite) are spawned.
      - run: node scripts/run-safe-e2e.mjs
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

  migrations:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm run check:db-migrations
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha }}

  build:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  worker-image:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Mesmo contexto do deploy no VPS: só arquivos versionados, via git archive.
      - run: >-
          git archive --format=tar HEAD |
          docker build --progress=plain -f deploy/worker/Dockerfile
          --build-arg GIT_SHA="$GITHUB_SHA" -t aspen-worker:ci -
      - name: Health
        run: |
          docker run -d --name aspen-worker --init --read-only --tmpfs /tmp:size=512m             --cap-drop ALL --security-opt no-new-privileges:true aspen-worker:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' aspen-worker)" = healthy ] && exit 0
            sleep 2
          done
          docker logs aspen-worker
          exit 1

  smoke:
    needs: [build]
    if: >-
      !cancelled() &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e:smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: playwright-smoke-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
