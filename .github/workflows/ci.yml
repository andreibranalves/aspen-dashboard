name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Detects whether a PR can affect code invariants at all. Docs-only changes
  # keep the light structural jobs green while skipping the heavy database and
  # browser lanes (AC #3). Scoping is conservative: anything outside the listed
  # non-source roots runs every lane, never fewer.
  #
  # NOTE: branch protection for master could NOT be confirmed remotely (GitHub
  # REST returns 403 on this plan/repository visibility — see ticket evidence).
  # If any of these lanes later become REQUIRED checks, remove the `if` guards
  # below BEFORE relying on merge gating; a skipped job reports success only
  # when it is not a required check.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          FILES="$(git diff --name-only "$BASE"...HEAD)"
          echo "changed files:"
          echo "$FILES"
          if echo "$FILES" | grep -qE '^(src/|api/|drizzle/|scripts/|tests/|extension/|\.github/workflows/ci\.yml|package\.json|package-lock\.json|playwright\.config\.js|vite\.config\..*|tsconfig.*\.json|index\.html|public/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:tailwind
      - run: npm run check:db-boundary
      - run: npm run check:integration-boundary
      - run: npm run check:whatsapp-extension
      - run: npm run check:vercel-functions

  postgres:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/aspen_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aspen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aspen_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      # Keep this aggregate check non-vacuous with deterministic disposable data.
      - run: npm run seed:quotation-company-verification
      - run: npm run verify:quotation-company
        env:
          REQUIRE_QUOTATION_COMPANY_BACKFILL: '1'
      - run: npm run test:postgres
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/quotation-origin.spec.js
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm run check:db-migrations
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha }}

  build:
    needs: [changes, lint, types, unit, boundary, migrations, postgres]
    if: '!cancelled() && needs.lint.result == ''success'' && needs.types.result == ''success'' && needs.unit.result == ''success'' && needs.boundary.result == ''success'' && needs.migrations.result == ''success'' && (needs.postgres.result == ''success'' || needs.postgres.result == ''skipped'')'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  smoke:
    needs: [build, changes]
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: playwright-smoke-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
