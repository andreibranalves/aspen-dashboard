name: Neon preview prune

# A integração Vercel + Neon e este workflow tentam limpar a branch Postgres
# `preview/<git-branch>` quando o PR fecha. A tentativa é best-effort: não
# prova que houve deployment, criação da branch ou remoção efetiva. Ver
# docs/release-lanes.md.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Best-effort: a branch pode não existir se o deploy de preview nunca
      # chegou a criá-la; uma falha aqui não deve poluir o PR fechado.
      - name: Delete Neon preview branch
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        continue-on-error: true
        with:
          project_id: dawn-art-45435232
          branch: preview/${{ github.event.pull_request.head.ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
