version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # 2.17.6+ puxa htmlparser2 12, sem entrada `require` para o bundle
      # CommonJS da Vercel (tests/unit/quotation-content.test.ts).
      - dependency-name: sanitize-html
        versions: [">=2.17.6"]
      # typescript-eslint 8 ainda não aceita TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Vite 8 exige @vitejs/plugin-react novo junto; upgrade manual.
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: "@vitejs/plugin-react"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
