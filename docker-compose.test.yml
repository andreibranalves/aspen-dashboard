services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: aspen_test
      POSTGRES_USER: aspen_test
      POSTGRES_PASSWORD: aspen_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aspen_test -d aspen_test"]
      interval: 2s
      timeout: 5s
      retries: 30
